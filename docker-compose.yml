services:
  app:
    build: .
    container_name: workreport
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "8501"

  caddy:
    image: caddy:2
    container_name: workreport-caddy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
