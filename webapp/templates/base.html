<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <title>{% block title %}汇报官{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/write' if info else '/activate' }}">
      <span class="brand-logo">报</span>
      <span class="brand-text">汇报官<small>WorkBrief</small></span>
    </a>
    {% if info %}
    <nav class="nav">
      <a href="/write" class="{{ 'on' if active == 'write' else '' }}">写汇报</a>
      <a href="/reports" class="{{ 'on' if active == 'reports' else '' }}">我的报告</a>
      <a href="/buy" class="{{ 'on' if active == 'buy' else '' }}">购买次数</a>
    </nav>
    <div class="top-right">
      <span class="quota-pill">{{ info.remaining }} 次可用</span>
      <a class="link-muted" href="/logout">退出</a>
    </div>
    {% endif %}
  </div>
</header>

<main class="wrap">
{% block content %}{% endblock %}
</main>

<footer class="foot">汇报官 · 兑换码即账号，换设备输入同一个码即可同步全部报告</footer>
<script src="/static/app.js"></script>
</body>
</html>
