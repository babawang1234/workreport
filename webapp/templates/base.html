<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F46E5">
  <title>{% block title %}AI 帮你写周报 - 智报{% endblock %}</title>
  <meta name="description" content="{% block description %}粘贴聊天记录、待办和随手记，20 秒生成结构清晰的日报、周报、月报。13 种岗位话术，缺数据自动标注，可直接提交。{% endblock %}">
  <meta name="keywords" content="周报生成,AI写周报,AI周报,周报生成器,日报生成,月报生成,工作汇报,周报模板">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{ site_url }}{{ request.url.path }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="智报">
  <meta property="og:title" content="{% block og_title %}AI 帮你写周报 - 智报{% endblock %}">
  <meta property="og:description" content="{% block og_desc %}粘贴工作碎片，20 秒生成可直接提交的日报、周报、月报。{% endblock %}">
  <meta property="og:url" content="{{ site_url }}{{ request.url.path }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "智报",
    "alternateName": "ZhiBao Agent",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "{{ site_url }}/activate",
    "description": "粘贴工作碎片，20 秒生成结构清晰的日报、周报、月报，13 种岗位话术，可直接提交。",
    "offers": {"@type": "Offer", "price": "0.99", "priceCurrency": "CNY"},
    "inLanguage": "zh-CN"
  }
  </script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=20261218">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ '/write' if info else '/activate' }}">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="8" y="17.5" width="3.6" height="6.5" rx="1.8" fill="#fff" fill-opacity=".74"/>
          <rect x="14.2" y="13" width="3.6" height="11" rx="1.8" fill="#fff" fill-opacity=".88"/>
          <rect x="20.4" y="8.6" width="3.6" height="15.4" rx="1.8" fill="#fff"/>
          <circle cx="22.2" cy="5.6" r="2.1" fill="#fff" fill-opacity=".92"/>
        </svg>
      </span>
      <span class="brand-text">智报<small>ZhiBao Agent</small></span>
    </a>
    {% if info %}
    <nav class="nav">
      <a href="/write" class="{{ 'on' if active == 'write' else '' }}">写汇报</a>
      <a href="/reports" class="{{ 'on' if active == 'reports' else '' }}">我的报告</a>
      <a href="/buy" class="{{ 'on' if active == 'buy' else '' }}">购买次数</a>
    </nav>
    <div class="top-right">
      <span class="quota-pill">{% if info.remaining < 0 %}无限次可用{% else %}{{ info.remaining }} 次可用{% endif %}</span>
      <a class="link-muted" href="/logout">退出</a>
    </div>
    {% else %}
    <nav class="nav">
      <a href="/write">免费试用</a>
      <a href="/buy">价格与购买</a>
    </nav>
    <div class="top-right">
      <a class="btn primary sm" href="/buy">立即购买</a>
      <a class="link-muted" href="/activate">兑换码激活</a>
    </div>
    {% endif %}
  </div>
</header>

<main class="wrap">
{% block content %}{% endblock %}
</main>

<footer class="foot">智报 · 兑换码即账号，换设备输入同一个码即可同步全部报告 · <a href="/guide">周报怎么写</a></footer>
<script src="/static/app.js?v=20261218"></script>
</body>
</html>
